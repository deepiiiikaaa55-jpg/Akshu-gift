<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Akshu ♡</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Poppins:wght@300;400;500;600&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at 15% 15%,#57213d 0%,transparent 35%),
    radial-gradient(circle at 85% 85%,#302044 0%,transparent 35%),
    #09070c;
    color:white;
    font-family:'Poppins',sans-serif;
    overflow-x:hidden;
}

.page{
    min-height:100vh;
    display:none;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.page.active{
    display:flex;
    animation:fade .8s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.box{
    width:100%;
    max-width:430px;
    text-align:center;
    padding:32px 22px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:30px;
    background:rgba(255,255,255,.055);
    backdrop-filter:blur(18px);
    box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.small{
    font-size:11px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:#dba7ba;
    margin-bottom:15px;
}

h1{
    font-family:'DM Serif Display',serif;
    font-size:48px;
    font-weight:400;
    line-height:1.1;
}

h2{
    font-family:'DM Serif Display',serif;
    font-size:34px;
    font-weight:400;
    margin-bottom:18px;
}

p{
    color:#eadde4;
    line-height:1.8;
    font-size:14px;
}
